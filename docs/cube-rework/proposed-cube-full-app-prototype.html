<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Cube prototype…</title>
</head>
<body>
  <p id="status" style="font:14px Segoe UI,Arial,sans-serif;padding:24px">Loading the interactive Cube prototype…</p>
  <script>
  (async () => {
    if (!("DecompressionStream" in window)) {
      throw new Error("This prototype needs a current version of Edge, Chrome, or Firefox with DecompressionStream support.");
    }

    const source = "https://raw.githubusercontent.com/streamlitdash/Rebirth/docs/cube-rework-deep-dive/docs/cube-rework/proposed-cube-full-app-prototype.html.gz";
    const response = await fetch(source, { cache: "no-store" });
    if (!response.ok || !response.body) {
      throw new Error(`Could not download the prototype payload (${response.status}).`);
    }

    const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  })().catch((error) => {
    document.getElementById("status").innerHTML = `<strong>Could not load the prototype.</strong><br>${error.message}<br><br>Make sure the computer is online, then reopen this HTML file.`;
    console.error(error);
  });
  </script>
</body>
</html>
