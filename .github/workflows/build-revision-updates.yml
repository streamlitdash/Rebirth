name: Build consolidated revision updates

on:
  push:
    branches:
      - docs/rebirth-v3-spec
    paths:
      - docs/rebirth-v3/.revision-build-ready

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out specification branch
        uses: actions/checkout@v4
        with:
          ref: docs/rebirth-v3-spec
          fetch-depth: 0

      - name: Fetch redesign branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main \
            docs/cube-rework-deep-dive \
            rebirth-v2 \
            docs/rebirth-v3-spec

      - name: Assemble every Markdown changed by the redesign branches
        shell: bash
        run: |
          set -euo pipefail
          output="docs/rebirth-v3/REVISION_UPDATES.md"
          body="$(mktemp)"
          index="$(mktemp)"
          declare -A seen
          source_count=0
          unique_count=0

          branches=(
            docs/cube-rework-deep-dive
            rebirth-v2
            docs/rebirth-v3-spec
          )

          for branch in "${branches[@]}"; do
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              [[ "$path" != "$output" ]] || continue
              if ! git cat-file -e "origin/$branch:$path" 2>/dev/null; then
                continue
              fi
              source_count=$((source_count + 1))
              digest="$(git show "origin/$branch:$path" | sha256sum | awk '{print $1}')"
              if [[ -n "${seen[$digest]:-}" ]]; then
                printf -- '- Duplicate source: `%s:%s` (same content as `%s`)\n' \
                  "$branch" "$path" "${seen[$digest]}" >> "$index"
                continue
              fi
              seen[$digest]="$branch:$path"
              unique_count=$((unique_count + 1))
              printf -- '%s. [`%s:%s`](#source-%03d)\n' \
                "$unique_count" "$branch" "$path" "$unique_count" >> "$index"
              {
                printf '\n<a id="source-%03d"></a>\n\n' "$unique_count"
                printf '# Source %03d — `%s:%s`\n\n' "$unique_count" "$branch" "$path"
                printf -- '- **Branch:** `%s`\n' "$branch"
                printf -- '- **Path:** `%s`\n' "$path"
                printf -- '- **SHA-256:** `%s`\n\n' "$digest"
                printf -- '---\n\n'
                git show "origin/$branch:$path"
                printf '\n\n---\n'
              } >> "$body"
            done < <(
              git diff --name-only --diff-filter=AMR \
                "origin/main...origin/$branch" -- '*.md' | sort
            )
          done

          {
            printf '# Rebirth Revision Updates\n\n'
            printf '> Consolidated Markdown archive of the Rebirth/Cube redesign documents committed across the redesign branches.\n>\n'
            printf '> **Reading rule:** this is historical. Later revisions supersede conflicting earlier statements.\n\n'
            printf -- '- Source Markdown paths represented: **%s**\n' "$source_count"
            printf -- '- Unique Markdown contents embedded: **%s**\n' "$unique_count"
            printf -- '- Source branches: `docs/cube-rework-deep-dive`, `rebirth-v2`, `docs/rebirth-v3-spec`\n\n'
            printf '## Consolidated source index\n\n'
            cat "$index"
            printf '\n---\n'
            cat "$body"
          } > "$output"

          test -s "$output"
          grep -q '^# Rebirth Revision Updates' "$output"
          grep -q 'docs/rebirth-v3-spec' "$output"

      - name: Commit the single consolidated Markdown file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f docs/rebirth-v3/.revision-build-ready
          rm -f .github/workflows/build-revision-updates.yml
          git add -A docs/rebirth-v3 .github/workflows/build-revision-updates.yml
          git commit -m "Consolidate redesign Markdown into revision updates"
          git push origin HEAD:docs/rebirth-v3-spec
